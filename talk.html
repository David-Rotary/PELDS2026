<style>
/* ===== District 9815 design system ===== */
:root{--navy:#0B2A5C;--royal:#17458F;--azure:#0067C8;--sky:#00A2E0;--gold:#F7A81B;--cran:#D41367;--violet:#901F93;--green:#009739;--orange:#FF7600;--turq:#00ADBB;
  --display:'Fraunces',Georgia,'Times New Roman',serif;--body:'Hanken Grotesk','Segoe UI',system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:#fff;font-family:var(--body)}
#deck{position:fixed;inset:0;background:linear-gradient(135deg,#0B2A5C 0%,#17458F 55%,#0067C8 100%)}
#deck::before{content:'';position:absolute;right:-20vw;top:-30vh;width:70vw;height:70vw;border-radius:50%;background:radial-gradient(circle,rgba(0,162,224,.28),rgba(0,162,224,0) 65%);pointer-events:none}
.rainbow{position:absolute;left:0;right:0;bottom:0;height:6px;display:flex;z-index:5}
.rainbow i{flex:1}
.slide{position:absolute;inset:0;padding:6vh 7vw 9vh;display:none;flex-direction:column;justify-content:center;animation:in .45s ease}
.slide.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:clamp(.8rem,1.15vw,1.05rem);margin-bottom:1.6vh}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.08;margin:0 0 2.4vh}
h1{font-size:clamp(2.6rem,6.4vw,6rem)} h2{font-size:clamp(2rem,4.2vw,4rem)}
h1 em,h2 em{font-style:italic;color:var(--gold);font-weight:500}
.lead{font-size:clamp(1.15rem,2vw,1.85rem);line-height:1.45;max-width:58ch;opacity:.95}
.lead p{margin:.4em 0}
.small{font-size:clamp(.85rem,1.1vw,1.05rem);opacity:.8}
.accent{font-family:'Dancing Script',var(--display);}
.panel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:2.6vh 2.2vw;backdrop-filter:blur(2px)}
.grid{display:grid;gap:2vh 1.6vw;margin-top:2vh}
.g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.tile{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:2.2vh 1.6vw}
.tile b{display:block;font-family:var(--display);font-size:clamp(1.15rem,1.8vw,1.7rem);margin-bottom:.6vh}
.tile span{font-size:clamp(.95rem,1.25vw,1.2rem);opacity:.88;line-height:1.4}
.tile .n{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;margin-bottom:1vh}
.big-q{font-family:var(--display);font-style:italic;font-size:clamp(1.8rem,3.6vw,3.4rem);line-height:1.25;max-width:30ch}
.big-q::before{content:'\201C';color:var(--gold)} .big-q::after{content:'\201D';color:var(--gold)}
.src{margin-top:2vh;font-size:clamp(.9rem,1.2vw,1.1rem);opacity:.75}
.divider{justify-content:flex-end}
.divider .num{font-family:var(--display);font-size:clamp(5rem,14vw,13rem);line-height:.9;color:var(--gold);opacity:.95}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:1vw;align-items:flex-start;font-size:clamp(1rem,1.5vw,1.4rem);margin:1.1vh 0;line-height:1.35}
.steps li::before{content:counter(s);flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:.85em}
.vwrap{display:grid;grid-template-columns:1.55fr 1fr;gap:2.4vw;align-items:center;margin-top:1vh}
.vwrap video{width:100%;max-height:62vh;border-radius:16px;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.vwrap .fallback{display:none}
.vwrap.novideo{grid-template-columns:1fr}
.vwrap.novideo video,.vwrap.novideo .vside{display:none}
.vwrap.novideo .fallback{display:block}
.link{display:inline-flex;align-items:center;gap:.5em;margin-top:2vh;background:var(--gold);color:var(--navy);font-weight:800;text-decoration:none;padding:.7em 1.3em;border-radius:999px;font-size:clamp(.95rem,1.2vw,1.15rem)}
.link.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5)}
.row{display:flex;gap:1vw;flex-wrap:wrap;align-items:center}
/* poll */
.pollgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:3vw;align-items:center}
.opt{position:relative;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:1.6vh 1.4vw;margin:1.2vh 0;font-size:clamp(1.1rem,1.8vw,1.6rem);cursor:pointer;display:flex;align-items:center;gap:1vw;user-select:none}
.opt .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(247,168,27,.28);transition:width .6s}
.opt b{position:relative;color:var(--gold)} .opt span{position:relative} .opt .c{position:relative;margin-left:auto;font-weight:800}
.qr{background:#fff;border-radius:18px;padding:12px;width:min(30vh,280px)} .qr svg{width:100%;height:auto;display:block}
.pollctl{margin-top:1.5vh;display:flex;gap:.6vw;flex-wrap:wrap}
.pollctl button,.hud button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.45em 1em;cursor:pointer;font:600 .9rem var(--body)}
/* commitment */
.commit{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw;margin-top:2.4vh}
.commit .tile{min-height:22vh}
/* HUD */
.hud{position:fixed;left:0;right:0;bottom:6px;display:flex;align-items:center;gap:10px;padding:8px 18px;z-index:20;font-size:.85rem;opacity:.0;transition:opacity .3s}
body:hover .hud,.hud.show{opacity:1}
.hud .dots{display:flex;gap:6px;margin:0 auto}
.hud .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer}
.hud .dots i.on{background:var(--gold)}
.notes{position:fixed;right:16px;bottom:56px;width:min(460px,90vw);max-height:62vh;overflow:auto;background:#fffdf5;color:#1d2433;border-radius:14px;padding:16px 18px;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.4);display:none;font-size:.95rem;line-height:1.5}
.notes.show{display:block}
.notes h4{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#8a5a00}
.notes .timebar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.notes .rec{background:#fff1d6;border:1px dashed #d79a1d;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:.88rem}
@media (max-width:820px){.g3,.commit,.pollgrid,.vwrap{grid-template-columns:1fr}.slide{padding:5vh 6vw 10vh;overflow:auto;justify-content:flex-start}}
@media print{.hud,.notes{display:none!important}}
</style>
</head>

<script>
/* =====================================================================
   THE SLIDES — edit the words here (in Notepad or the GitHub editor).
   Each slide has: type, the words shown, notes (only you see them with N),
   mins (planned minutes, for the timer), and for video slides a file name
   in the "videos" folder. If a video file is missing, the slide shows its
   step-by-step fallback instead, so the talk always works.

var SITE = 'https://www.rotary9815.org.au';
var SLIDES = [
  { type: 'title', mins: 0.5,
    kicker: 'Pre-PELDS 2026 · Rotary District 9815',
    title: 'From <em>Why me?</em><br>to <em>Why not me?</em>',
    lead: 'Your year as President, and the leader it will make you.',
    by: 'David Button · District Webmaster & Communications Chair',
    notes: 'Welcome everyone. Smile, slow down. "This is not a lecture. For the next 20 minutes I want to be the mentor a lot of you may not have at your club right now."' },

  { type: 'poll', mins: 1.5, id: 'talk-said-yes',
    kicker: 'Be honest — phones out, or hands up',
    title: 'When you said <em>yes</em> to being President, you felt…',
    options: ['Excited — bring it on', 'Nervous, but willing', 'Talked into it', 'Still not sure why I said yes'],
    notes: 'If the online service is set up, click "Open vote on phones" (sign in to presenter.html once beforehand on this laptop). Otherwise ask for hands and click each option to tally.\nThen: "Look around. If you ticked nervous or talked into it, you are in the majority — and you are exactly the kind of person who makes a great President, because you are taking it seriously."' },

  { type: 'text', mins: 1,
    kicker: 'Let\'s name it',
    title: 'Clubs are finding it hard to find Presidents.<br><em>And many of you don\'t have a mentor.</em>',
    lead: '<p>The people who used to walk beside a new President have moved on, moved away, or are tired.</p><p>So today, and through the toolkit all year, <b>let us be that mentor for you.</b></p>',
    notes: 'Acknowledge the reality without doom. Key line: "You are not on your own this year — the District has your back." Pause.' },

  { type: 'video', mins: 1.25, file: 'videos/mentor-letter.mp4',
    kicker: 'A letter to a new President',
    title: 'What I wish someone had told me',
    fallback: '<div class="big-q">You don\'t have to be the best Rotarian in the room. You just have to care, ask good questions, and let other people shine.</div><div class="src">— a past President\'s advice (record your own version)</div>',
    notes: 'Play your 45–60 second talking-to-camera video. Suggested outline (in your own words): when you were first asked; the "why me?" moment; what the year actually gave you (confidence, friendships, skills); one thing you\'d tell yourself; "you can do this, and you won\'t be alone."',
    record: 'mentor-letter.mp4 — you talking to camera on your phone, 45–60 sec, landscape, quiet room.' },

  { type: 'grid', mins: 1.5, cols: 3,
    kicker: 'The reframe',
    title: 'This isn\'t a job. It\'s a <em>leadership course</em>,<br>with a team to practise on.',
    tiles: [
      ['Chairing meetings', 'Run a room, keep it on track, make decisions stick.'],
      ['Influence', 'Lead volunteers, where nobody has to do what you say.'],
      ['Delegation', 'Grow other people instead of doing it all yourself.'],
      ['Strategy', 'Pick two or three things that matter and see them through.'],
      ['Speaking', 'Find your voice in front of members, partners and media.'],
      ['Culture', 'Shape how your club feels on a Tuesday night.']],
    notes: '"People pay thousands for leadership programs that teach these six things. You get them with friends, for a cause, and with support." Ask: "Which one of these would help you at work, or in your family, or your community?"' },

  { type: 'grid', mins: 1, cols: 3,
    kicker: 'What great Presidents actually do',
    title: 'Three jobs. <em>Not thirty.</em>',
    tiles: [
      ['1 · Set direction', 'Agree the club\'s two or three priorities and keep everyone pointed at them.'],
      ['2 · Build the team', 'A capable Board with clear roles, and chairs you support and recognise.'],
      ['3 · Look after the people', 'Members feel welcome, useful and noticed. Grow your successor.']],
    link: [SITE + '/page/leadership-flow', 'Leadership Hub'],
    notes: 'These come from the Leadership Flow\'s "President\'s core role", boiled down. "If you only remember three things from today, remember these."' },

  { type: 'divider', mins: 0.25, num: '01', kicker: 'Building block one', title: 'Your <em>one-page</em> club plan' },

  { type: 'grid', mins: 1.5, cols: 3,
    kicker: 'A plan fits on one page',
    title: 'Three questions. <em>Two or three goals.</em>',
    tiles: [
      ['Where are we now?', 'Members, trends, projects, money, mood. Be honest — your Board will respect it.'],
      ['Where do we want to be on 30 June?', 'Picture your changeover night. What do you want them to say about your year?'],
      ['What will we do to get there?', 'Two or three goals, each with a number and an owner. Not twelve.']],
    notes: 'The toolkit\'s "Building your Presidential Plan" module asks these questions and builds the plan for them. "Most successful Presidents pick two or three goals and do them well."' },

  { type: 'video', mins: 1.75, file: 'videos/leadership-flow.mp4',
    kicker: 'Your guide for the year',
    title: 'The Leadership Hub on the District website',
    steps: ['Go to rotary9815.org.au → <b>Your Role</b> → <b>Leadership Hub</b>', 'Press <b>Start Guided Flow</b> — 7 steps, one at a time', '<b>Lead Your Club</b>: governance checklist and running great Board meetings', '<b>Year Planner</b>: what to do each quarter, July to June', '<b>Succession</b>: grow the person who follows you'],
    link: [SITE + '/page/leadership-flow', 'Open the Leadership Hub'],
    notes: 'Show, don\'t read. Point out the guided flow, the Board meeting tips and the Year Planner. Remind them: Membership, Foundation, Public Image, Secretary and Treasurer each have their own hub too (Role Finder).',
    record: 'leadership-flow.mp4 — 30–40 sec screen recording: homepage → Your Role → Leadership Hub → Start Guided Flow → click through Lead Your Club → Year Planner.' },

  { type: 'quote', mins: 0.75,
    kicker: 'One habit that changes Board meetings',
    quote: 'What is the most important thing we could decide today?',
    src: 'Open every Board meeting with this question — from the Leadership Flow\'s "Running Effective Board Meetings"',
    notes: 'Also: agenda out 48 hours ahead; every action gets an owner and a date; close with one thing done well and one member to recognise.' },

  { type: 'divider', mins: 0.25, num: '02', kicker: 'Building block two', title: 'Membership <em>starts with you</em>' },

  { type: 'grid', mins: 1.75, cols: 2,
    kicker: 'The President\'s membership pledge',
    title: 'Four things only <em>you</em> can do',
    tiles: [
      ['Invite two people yourself', 'Personally ask at least two prospective members this year.'],
      ['Welcome every new member', 'Be there at their induction. Give them a real job within weeks.'],
      ['Make it a standing Board item', 'Members, new joins, departures, net growth, at risk — every month.'],
      ['Notice who\'s drifting', 'Talk about at-risk members at the Board, not just the Membership Chair. Then pick up the phone.']],
    foot: 'Disengaged members leave. Engaged members stay. Energised members bring their friends.',
    notes: 'From the Leadership Flow "Membership from the President\'s perspective". Also: agree membership goals with your Membership Chair in your first quarter. Emphasise retention: "Keeping the members you have is the fastest growth there is."' },

  { type: 'video', mins: 2, file: 'videos/membership-hub.mp4',
    kicker: 'Help is already built',
    title: 'Membership Hub + Club Assist',
    steps: ['District site → <b>Your Role</b> → <b>Membership Hub</b>: attract, onboard, engage, retain', 'Rotary South Pacific → <b>Club Assist</b>', 'Choose <b>Victoria</b>, then sub-topic <b>Retention &amp; engagement</b> or <b>Attraction</b>', 'Watch a short video, or tap <b>Share by email</b> to send it to your Membership Chair'],
    link: [SITE + '/page/membership-flow', 'Open the Membership Hub'],
    link2: ['https://clubassistrsp.z26.web.core.windows.net/?sub=Retention+%26+engagement&jur=Victoria', 'Club Assist: retention'],
    notes: 'Club Assist has short videos like "Are we relationship material?" (retention) and "A guaranteed method for attracting new members". Share by email is a great trick for busy Presidents.',
    record: 'membership-hub.mp4 — 30–40 sec: Membership Hub sections, then Club Assist filtered to Victoria + Retention & engagement, opening one video card.' },

  { type: 'divider', mins: 0.25, num: '03', kicker: 'Make it real', title: 'Put your goals in <em>My Rotary</em>' },

  { type: 'video', mins: 2.25, file: 'videos/club-central.mp4',
    kicker: 'Ten minutes that make your plan official',
    title: 'Set your club goals in Rotary Club Central',
    steps: ['Go to <b>my.rotary.org</b> → <b>Sign in</b> (or <b>Register</b> — use the email your club has for you)', 'Open <b>Rotary Club Central</b>', 'Choose the <b>right Rotary year</b> at the top — yours!', 'Look at your club\'s <b>history and trends</b> first, then set a realistic membership goal', 'Add your <b>Foundation</b> giving goals, and <b>Save</b> each one before moving on'],
    link: ['https://my.rotary.org/en/login', 'Open My Rotary'],
    notes: 'Check before the talk exactly what a President-Elect can edit and from when (confirm with the District Secretary). Tip: base the membership goal on history — a 34-member club aiming for 38–40 is more believable than 50.',
    record: 'club-central.mp4 — 40 sec: my.rotary.org sign-in → Rotary Club Central → year selector → Membership goal with history panel → Save. Blur or crop any personal details.' },

  { type: 'video', mins: 1.5, file: 'videos/club-assist.mp4',
    kicker: 'You\'re not on your own',
    title: 'Where to find help, <em>any time</em>',
    steps: ['<b>Your Assistant Governor</b> — your first call, always', '<b>District hubs</b> — rotary9815.org.au → Your Role (Role Finder)', '<b>Club Assist</b> — choose Victoria + <b>Club President</b>, or <b>Ask a Zone Specialist</b>', '<b>Your PE Toolkit</b> — your mentor in your pocket, all year'],
    link: ['https://rotarysouthpacific.org/Page/rotary-club-assist', 'Open Club Assist'],
    link2: ['index.html', 'Open the PE Toolkit'],
    notes: 'Club Assist filtered to Club President shows the Rotary Learning Centre "Club President Essentials" courses (My Rotary login needed). "Ask a Zone Specialist" goes to the Specialist Hub.',
    record: 'club-assist.mp4 — 30 sec: Club Assist → Victoria → Club President → show the Essentials courses → Ask a Zone Specialist button.' },

  { type: 'commit', mins: 1.25,
    kicker: 'Before you leave',
    title: 'Your first <em>three moves</em>',
    tiles: [
      ['1 · This week', 'Open the PE Toolkit and answer "Why did you say yes?"'],
      ['2 · This month', 'Ask someone to be your mentor — a past President, from any club.'],
      ['3 · Before 1 July', 'Your one-page plan, your membership pledge, your goals in Club Central.']],
    notes: 'Hand out or point to the commitment card (scan the QR). Mention the proposed mentor circles if the District has approved them.',
    qr: 'commitment-card.html' },

  { type: 'title', mins: 0.25,
    kicker: 'Rotary District 9815',
    title: 'Why me?<br><em>Why not me.</em>',
    lead: 'You said yes. That\'s the hardest part done. Let\'s build the leader it makes you.',
    by: 'The PE Toolkit, the hubs and your District are with you all year.',
    notes: 'Close warmly. Thank them. "Let\'s get your year started."' }
];
</script>
<script>
(function () {
  'use strict';
  var deck = document.getElementById('deck'), esc = PE.esc, cur = 0, started = null, els = [];
  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function linkHTML(l, ghost) { if (!l) return ''; var ext = /^https?:/.test(l[0]); return '<a class="link' + (ghost ? ' ghost' : '') + '" href="' + l[0] + '"' + (ext ? ' target="_blank" rel="noopener"' : ' target="_blank"') + '>' + esc(l[1]) + ' ↗</a>'; }
  function head(s) { return (s.kicker ? '<div class="kicker">' + s.kicker + '</div>' : '') + (s.title ? '<h2>' + s.title + '</h2>' : ''); }
  function qrSVG(url, size) { if (!window.qrcode) return ''; var q = qrcode(0, 'M'); q.addData(url); q.make(); return q.createSvgTag({ cellSize: size || 6, margin: 2, scalable: true }); }
  function siteBase() {
    var C = window.PE_CONFIG || {};
    if (C.SITE_URL) return String(C.SITE_URL).replace(/\/?$/, '/');
    return /^https?:/.test(location.protocol) ? location.href.replace(/[?#].*$/, '').replace(/[^\/]*$/, '') : '';
  }

  /* ---------- build slides ---------- */
  SLIDES.forEach(function (s, i) {
    var d = el('section', 'slide' + (s.type === 'divider' ? ' divider' : '')), h = '';
    if (s.type === 'title') h = '<div class="kicker">' + s.kicker + '</div><h1>' + s.title + '</h1><div class="lead"><p>' + s.lead + '</p></div>' + (s.by ? '<p class="small" style="margin-top:4vh">' + s.by + '</p>' : '');
    if (s.type === 'text') h = head(s) + '<div class="lead">' + s.lead + '</div>';
    if (s.type === 'divider') h = '<div class="num">' + s.num + '</div><div class="kicker">' + s.kicker + '</div><h1 style="margin:0">' + s.title + '</h1>';
    if (s.type === 'quote') h = '<div class="kicker">' + s.kicker + '</div><div class="big-q">' + esc(s.quote) + '</div><div class="src">' + esc(s.src) + '</div>';
    if (s.type === 'grid' || s.type === 'commit') {
      h = head(s) + '<div class="' + (s.type === 'commit' ? 'commit' : 'grid g' + (s.cols || 3)) + '">' + s.tiles.map(function (t) { return '<div class="tile"><b>' + t[0] + '</b><span>' + t[1] + '</span></div>'; }).join('') + '</div>' +
        (s.foot ? '<p class="lead" style="margin-top:2.4vh;font-family:var(--display);font-style:italic;color:var(--gold)">' + s.foot + '</p>' : '') +
        (s.link ? '<div class="row">' + linkHTML(s.link) + '</div>' : '');
      if (s.qr) {
        var base = siteBase(), url = base ? base + s.qr : '';
        h += '<div class="row" style="margin-top:2.4vh;gap:2vw">' + (url ? '<div class="qr" style="width:min(20vh,180px)">' + qrSVG(url, 5) + '</div>' : '') +
          '<div class="lead"><p><b>Scan for your commitment card</b></p><p class="small">' + (url ? esc(url) : 'Open commitment-card.html') + '</p>' + linkHTML([s.qr, 'Open the card']) + '</div></div>';
      }
    }
    if (s.type === 'video') {
      var steps = s.steps ? '<ol class="steps">' + s.steps.map(function (x) { return '<li><span>' + x + '</span></li>'; }).join('') + '</ol>' : '';
      h = head(s) + '<div class="vwrap" data-v><video src="' + s.file + '" controls playsinline preload="metadata"></video>' +
        '<div class="vside">' + (steps ? '<div class="panel">' + steps + '</div>' : '') + '<div class="row">' + linkHTML(s.link) + linkHTML(s.link2, true) + '</div></div>' +
        '<div class="fallback">' + (s.fallback || '<div class="panel">' + steps + '</div><div class="row">' + linkHTML(s.link) + linkHTML(s.link2, true) + '</div>') + '</div></div>';
    }
    if (s.type === 'poll') {
      h = '<div class="pollgrid"><div>' + head(s) + '<div class="opts">' + s.options.map(function (o, k) { return '<div class="opt" data-k="' + k + '"><div class="fill"></div><b>' + String.fromCharCode(65 + k) + '</b><span>' + esc(o) + '</span><span class="c">0</span></div>'; }).join('') + '</div>' +
        '<div class="pollctl"><button data-a="live" class="hidden-live">Open vote on phones</button><button data-a="reset">Reset</button><span class="small" data-msg>Click an option to count hands.</span></div></div>' +
        '<div data-qrbox style="display:none"><div class="qr" data-qr></div><p class="small" style="margin-top:1vh">Scan with your phone camera. No app, no login.</p></div></div>';
    }
    d.innerHTML = h; deck.appendChild(d); els.push(d);
    /* video: fall back to steps if the file is missing */
    var vw = d.querySelector('[data-v]');
    if (vw) { var v = vw.querySelector('video'); v.addEventListener('error', function () { vw.classList.add('novideo'); }); if (location.protocol === 'file:') v.load(); }
    if (s.type === 'poll') setupPoll(d, s);
  });

  /* ---------- poll: hands-up tally, or live phones via the presenter service ---------- */
  function setupPoll(d, s) {
    var counts = s.options.map(function () { return 0; }), live = false, timer = null;
    var admin = '', room = 'prepelds';
    try { admin = localStorage.getItem('pe-admin') || ''; room = localStorage.getItem('pe-room') || 'prepelds'; } catch (e) {}
    var liveBtn = d.querySelector('[data-a=live]'), msg = d.querySelector('[data-msg]');
    var canLive = PE.ai && PE.ai.url && admin;
    if (!canLive) liveBtn.style.display = 'none';
    function draw() {
      var tot = counts.reduce(function (a, b) { return a + b; }, 0);
      d.querySelectorAll('.opt').forEach(function (o, k) { o.querySelector('.c').textContent = counts[k] + (tot ? ' · ' + Math.round(100 * counts[k] / tot) + '%' : ''); o.querySelector('.fill').style.width = (tot ? 100 * counts[k] / tot : 0) + '%'; });
    }
    d.querySelectorAll('.opt').forEach(function (o, k) { o.onclick = function () { if (live) return; counts[k]++; draw(); }; });
    d.querySelector('[data-a=reset]').onclick = function () { counts = counts.map(function () { return 0; }); draw(); };
    liveBtn.onclick = function () {
      var api = function (a, b) { b = b || {}; b.admin = admin; b.room = room; return PE.ai.post('/api/live/' + a, b); };
      api('whoami').then(function (r) {
        if (!r.ok) { msg.textContent = 'Presenter sign-in needed: open presenter.html once on this laptop.'; return; }
        var base = siteBase();
        if (base) { d.querySelector('[data-qr]').innerHTML = qrSVG(base + 'join.html?code=' + encodeURIComponent(r.accessCode) + (room !== 'prepelds' ? '&room=' + encodeURIComponent(room) : ''), 6); d.querySelector('[data-qrbox]').style.display = 'block'; }
        return api('set', { activity: { type: 'poll', id: s.id, title: s.title.replace(/<[^>]+>/g, ''), options: s.options, open: true, reveal: false } }).then(function () {
          live = true; liveBtn.textContent = 'Live on phones ✓'; msg.textContent = 'Votes update every few seconds.';
          clearInterval(timer);
          timer = setInterval(function () {
            if (!d.classList.contains('on')) return;
            api('results', { poll: s.id }).then(function (x) { var c = x.counts || {}; counts = s.options.map(function (_, k) { return c[k] || 0; }); draw(); }).catch(function () {});
          }, 2500);
        });
      }).catch(function () { msg.textContent = 'Could not reach the online service — use hands up instead.'; });
    };
    draw();
  }

  /* ---------- navigation, dots, notes, timer ---------- */
  var dots = document.getElementById('dots'), notes = document.getElementById('notes'), count = document.getElementById('count');
  SLIDES.forEach(function (_, i) { var b = el('i'); b.onclick = function () { go(i); }; dots.appendChild(b); });
  var planned = SLIDES.reduce(function (a, s) { return a + (s.mins || 0); }, 0);
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2); }
  function drawNotes() {
    var s = SLIDES[cur], el2 = (Date.now() - (started || Date.now())) / 1000;
    var plannedHere = SLIDES.slice(0, cur).reduce(function (a, x) { return a + (x.mins || 0); }, 0) * 60;
    notes.innerHTML = '<div class="timebar"><span>Elapsed ' + fmt(el2) + '</span><span>Planned here ' + fmt(plannedHere) + ' of ' + fmt(planned * 60) + '</span></div>' +
      '<h4>Slide ' + (cur + 1) + ' · about ' + (s.mins || 0) + ' min</h4><div>' + esc(s.notes || '').replace(/\n/g, '<br>') + '</div>' +
      (s.record ? '<div class="rec"><b>🎬 Video for this slide:</b> ' + esc(s.record) + '</div>' : '') +
      '<p style="font-size:.8rem;color:#777;margin:10px 0 0">← → or space to move · N notes · F full screen · T restart timer</p>';
  }
  function go(i) {
    i = Math.max(0, Math.min(SLIDES.length - 1, i));
    els.forEach(function (e, k) { e.classList.toggle('on', k === i); if (k !== i) { var v = e.querySelector('video'); if (v) v.pause(); } });
    cur = i; if (!started && i > 0) started = Date.now();
    dots.querySelectorAll('i').forEach(function (d, k) { d.classList.toggle('on', k === i); });
    count.textContent = (i + 1) + ' / ' + SLIDES.length;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
    drawNotes();
  }
  setInterval(function () { if (notes.classList.contains('show')) drawNotes(); }, 1000);
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(SLIDES.length - 1);
    else if (e.key === 'n' || e.key === 'N') notes.classList.toggle('show');
    else if (e.key === 'f' || e.key === 'F') fs();
    else if (e.key === 't' || e.key === 'T') { started = Date.now(); drawNotes(); }
  });
  function fs() { var d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(function () {}); else if (document.exitFullscreen) document.exitFullscreen().catch(function () {}); }
  document.getElementById('bPrev').onclick = function () { go(cur - 1); };
  document.getElementById('bNext').onclick = function () { go(cur + 1); };
  document.getElementById('bNotes').onclick = function () { notes.classList.toggle('show'); };
  document.getElementById('bFs').onclick = fs;
  var sx = null;
  deck.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener('touchend', function (e) { if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); sx = null; });
  go(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
})();
</script>
</body>
